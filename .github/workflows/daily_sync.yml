name: Daily Sunday Suspense Playlist Sync

on:
  schedule:
    # Runs everyday at 13:30 UTC (7:00 PM IST / 19:00 IST)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow

      - name: Run Playlist Extraction & Sync
        run: |
          python scripts/fetch_playlist.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          if git diff --staged --quiet; then
            echo "No new Sunday Suspense episodes found today."
          else
            git commit -m "chore(sync): update latest Sunday Suspense episodes [skip ci]"
            git push
          fi
